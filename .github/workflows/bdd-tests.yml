name: BDD Service Tests

on:
  workflow_run:
    workflows: ["Build Project"]
    types:
      - completed

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    # Only run if the Build Project workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Data Service
        uses: actions/checkout@v4
        with:
          # We need to explicitly check out the commit that triggered the build
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: target-artifact
          path: target/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Data Service Docker Image
        run: |
          docker build \
            -t ghcr.io/ase-compas/lfenergy/compas-scl-data-service:${{ github.event.workflow_run.head_sha }} \
            -f app/src/main/docker/Dockerfile.jvm \
            .

      - name: Run Mock Services
        run: |
          cd service-tests
          docker-compose -f docker-compose-ci.yml up -d

      - name: Run SCL Data Service
        run: |
            docker run -d --rm \
              --name scl-data-service \
              -p 8080:8080 \
              -e POSTGRESQL_HOST=postgresql \
              -e POSTGRESQL_DB=compas \
              -e QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/compas?currentSchema=scl_data \
              -e QUARKUS_DATASOURCE_REACTIVE_URL=postgresql://localhost:5432/compas?currentSchema=scl_data \
              -e QUARKUS_FLYWAY_SCHEMAS=scl_data \
              -e QUARKUS_FLYWAY_BASELINE_ON_MIGRATE=true \
              -e QUARKUS_DATASOURCE_USERNAME=postgres \
              -e QUARKUS_DATASOURCE_PASSWORD=postgres \
              -e JWT_VERIFY_KEY=http://localhost:8089/auth/realms/compas/protocol/openid-connect/certs \
              -e JWT_VERIFY_ISSUER=http://localhost:8089/auth/realms/compas \
              -e JWT_VERIFY_CLIENT_ID=scl-data-service \
              -e JWT_GROUPS_PATH=resource_access/scl-data-service/roles \
              -e USERINFO_NAME_CLAIMNAME=name \
              -e USERINFO_WHO_CLAIMNAME=name \
              -e USERINFO_SESSION_WARNING=20 \
              -e USERINFO_SESSION_EXPIRES=30 \
              ghcr.io/ase-compas/lfenergy/compas-scl-data-service:${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Service Tests
        run: |
          mkdir -p test-reports
          docker pull ghcr.io/ase-compas/compas-service-tests:latest
          docker run --rm \
            -e SCL_DATA_SERVICE_VERSION=${{ github.event.workflow_run.head_sha }} \
            -e CUCUMBER_TAGS="@smoke and @scl-data-service" \
            -v "${{ github.workspace }}/service-tests/steps:/custom-steps:ro" \
            -v "${{ github.workspace }}/service-tests/features:/custom-features:ro" \
            -v "${{ github.workspace }}/test-reports:/reports" \
            ghcr.io/ase-compas/compas-service-tests:latest       

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-cucumber-reports
          path: test-reports/

      - name: Delete Build Artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: target-artifact