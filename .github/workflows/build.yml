name: Build Project

on:
  push:
    branches:
      - 'feature/add_transnet_plugins'
  pull_request:
    branches:
      - 'feature/add_transnet_plugins'

permissions:
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Create custom Maven Settings.xml
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          output_file: custom_maven_settings.xml
          servers: '[{ "id": "github-packages-compas", "username": "OWNER", "password": "${{ secrets.GITHUB_TOKEN }}" }]'

      - name: Build with Maven (Pull Request)
        if: ${{ github.event_name == 'pull_request' }}
        run: ./mvnw -s custom_maven_settings.xml -B -Pnative-image clean verify

      - name: Build and push Docker image
        id: push
        run: |
          docker tag lfenergy/compas-scl-data-service:0.15.3-SNAPSHOT-postgresql ghcr.io/ase-compas/lfenergy/compas-scl-data-service:0.15.3-SNAPSHOT-postgresql
          docker push ghcr.io/ase-compas/lfenergy/compas-scl-data-service:0.15.3-SNAPSHOT-postgresql
