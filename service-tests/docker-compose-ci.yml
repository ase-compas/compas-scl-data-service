services:
  postgresql:
    image: "postgres:16.12"
    container_name: postgresql
    labels:
      compas: true
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=compas
      - PGDATA=/var/lib/postgresql/data/compas
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - postgresql-data-volume:/var/lib/postgresql/data
    networks:
      - test-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    container_name: keycloak
    ports:
      - "8089:8080"
    labels:
      compas: true
    command: start-dev --db=postgres --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgresql:5432/compas
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KC_HOSTNAME=http://127.0.0.1:8089/auth
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_RELATIVE_PATH=auth
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./config/compas-realm.json:/opt/keycloak/data/import/compas-realm.json:ro
    healthcheck:
      test: [ "CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/8080" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - test-network